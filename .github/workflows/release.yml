name: release

# Publishes the NuGet package when a version tag (e.g. v2.1.0) is pushed.
# Requires a repository secret named NUGET_API_KEY (nuget.org API key).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Pack
        run: >-
          dotnet pack SlackBotMessages/SlackBotMessages.csproj
          --configuration Release
          --output ./artifacts

      - name: Push to NuGet.org
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true
